github_repo: "MESAHub/mesa"
local_repo_path: "/home/nill/MESA/mesa"
poll_interval_seconds: 120
build_submit_command: "mesa_test submit --empty"
test_command: "mesa_test test custom_colors"
dispatch_interval_seconds: 43200
dispatch_state_path: "~/.mesa_test/last_idle_dispatch"
dispatch_command: "timeout --signal=TERM --kill-after=30s 55m python3 -u background_test.py"
github_token: ""
verbose: true

rules:
  ignore_skip_authors:
    - "nialljmiller"
  watch_paths:
    - "colors/"
    - "star/test_suite/custom_colors/"
  branches:
    always_test_keywords:
      - "customcolors"
      - "filter_interp"
    exclude_keywords:
      - "wip"
  commits:
    full_run_keywords:
      - "VEGA"
    skip_keywords:
      - "CI_SKIP"
